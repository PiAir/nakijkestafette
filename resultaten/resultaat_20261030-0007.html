ack_model": "CLUSTER.qwen3.8:latest", "feedback_s": 8.8}, {"id": "L07", "antwoord": "Wolken vallen uit de lucht en dan stroomt het water in de zee.", "verwacht": {"triage": "GELDIG", "score": 1}, "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_letter": "A", "triage_s": 0.5, "score": 1, "fout_tag": "[Vergeet neerslag]", "score_model": "CLUSTER.nimble:9b", "score_letter": "B", "tag_letter": "C", "score_s": 3.9, "feedback": "Goed dat je de condensatie in de wolken en het terugstromen naar de zee noemt, maar onthoud dat het water zelf als neerslag (regen of sneeuw) naar beneden komt. Maak de kringloop compleet door deze stap expliciet te benoemen.", "feedback_model": "CLUSTER.qwen3.8:latest", "feedback_s": 12.9}, {"id": "L08", "antwoord": "Het water stroomt via rivieren naar de zee en komt dan weer terug in de lucht.", "verwacht": {"triage": "GELDIG", "score": 1}, "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_letter": "A", "triage_s": 0.6, "score": 1, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.nimble:9b", "score_letter": "B", "tag_letter": "E", "score_s": 3.9, "feedback": "Goed dat je de stroomrichting naar de zee noemt, maar let op: water komt niet direct terug in de lucht, maar verdampt eerst om later als neerslag te vallen. Kijk naar die verdamplingsfase als je volgende stap om de kringloop compleet te maken.", "feedback_model": "CLUSTER.qwen3.8:latest", "feedback_s": 9.6}, {"id": "L09", "antwoord": "Als het warm is dan verdampt het water en dat wordt dan wind die de wolken door de lucht duwt.", "verwacht": {"triage": "GELDIG", "score": 1}, "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_letter": "A", "triage_s": 0.6, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.nimble:9b", "score_letter": "C", "tag_letter": "E", "score_s": 4.2, "feedback": "Je hebt goed begrepen dat warmte : "", "verwacht": {"triage": "ONGELDIG"}, "actief": null, "actief_sinds": null, "triage": "ONGELDIG", "triage_model": "voorfilter (vaste regel)", "triage_reden": "leeg antwoord", "triage_s": 0.0}, {"id": "L18", "antwoord": "In de zee wordt water verdampt en dan regent het weer op de bergen.", "verwacht": {"triage": "GELDIG", "score": 1}, "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_letter": "A", "triage_s": 0.4, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.nimble:9b", "score_letter": "B", "tag_letter": "B", "score_s": 4.0, "feedback": "Je hebt goed begrepen dat water verdampt en als neerslag terugvalt, maar je bent de stap van condensatie vergeten. Probeer de waterkringloop volgend te beschrijven: verdamping, condensatie in de lucht en daarna neerslag.", "feedback_model": "CLUSTER.qwen3.8:latest", "feedback_s": 8.8}, {"id": "L19", "antwoord": "Het water loopt langzaam de berg op en dan valt het er weer van af als regen.", "verwacht": {"triage": "GELDIG", "score": 1}, "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_letter": "A", "triage_s": 0.4, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.nimble:9b", "score_letter": "C", "tag_letter": "E", "score_s": 4.2, "feedback": "Goed dat je inzicht hebt in het proces, maar water kan niet vanzelf de berg oplopen; het verdampt eerst en stijgt als waterdamp. De volgende stap is om te benoemen dat deze damp in de hoogte condenseert tot wolken, waarna het als neerslag naar beneden valt.", "feedback_model": "CLUSTER.qwen3.8:latest", "feedback_s": 11.1}, {"id": "L20", "antwoord": "Iets met wolken en regen, maar ik weet de fases niet echt te benoemen.", "verwacht": {"triage": "GELDIG", "score": 0}, "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_letter": "A", "triage_s": 0.5, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.nimble:9b", "score_letter": "B", "tag_letter": "B", "score_s": 3.4, "feedback": "Goed dat je al weet dat wolken en regen erbij horen, maar vergeet niet dat condensatie de cruciale stap is waarbij waterdamp weer vloeibaar wordt. Probeer de volgorde te oefenen: verdamping, dan condensatie, en eindelijk neerslag.", "feedback_model": "CLUSTER.qwen3.8:latest", "feedback_s": 7.1}], "log": [{"t": 1793315143812, "stap": null, "soort": "info", "tekst": "Run gestart: 20 exit-tickets"}, {"t": 1793315144074, "stap": "triage", "soort": "stokje", "tekst": "Tev1 neemt het stokje over"}, {"t": 1793315144428, "stap": "triage", "soort": "wissel", "tekst": "ERASMUS.tev1:4b valt uit (HTTP 400 Error code: 400 - {\"detail\":\"\\\"tev1:4b\\\" does not support chat\"}) → substitute: ERASMUS.tev1:0.8b"}, {"t": 1793315146812, "stap": "triage", "soort": "klaar", "tekst": "Tev1 klaar in 0:03"}, {"t": 1793315146813, "stap": "scoring", "soort": "stokje", "tekst": "Nimble neemt het stokje over"}, {"t": 1793315165408, "stap": "scoring", "soort": "klaar", "tekst": "Nimble klaar in 0:19"}, {"t": 1793315165409, "stap": "feedback", "soort": "stokje", "tekst": "Qwen3.8 neemt het stokje over"}, {"t": 1793315215169, "stap": "feedback", "soort": "klaar", "tekst": "Qwen3.8 klaar in 0:50"}, {"t": 1793315215170, "stap": "briefing", "soort": "stokje", "tekst": "Qwen3.8 neemt het stokje over"}, {"t": 1793315259343, "stap": "briefing", "soort": "klaar", "tekst": "Qwen3.8 klaar in 0:44"}, {"t": 1793315259345, "stap": null, "soort": "klaar", "tekst": "Estafette klaar in 1:56"}], "briefing": {"markdown": "## Samenvatting klasprestaties\nDe klas bestaat uit 20 leerlingen, waarvan 16 een geldig ticket hebben ingeleverd. De gemiddelde score is 0,81. De scoreverdeling toont 6 leerlingen met een score van 0, 7 leerlingen met een score van 1 en 3 leerlingen met een score van 2. De meest voorkomende fouten zijn begripsfouten (8 keer) en het vergeten van de fase condensatie (4 keer). Slechts 3 le /* ── detail ──────────────────────────────────────────────────────────── */
dialog {
  border: 0; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--papier); color: var(--inkt); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(28, 40, 51, .45); }
.detail { padding: 22px 26px 24px; }
.detail header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.detail h2 { margin: 0; font-size: 22px; }
.detail .sluit { border: 1.5px solid var(--lijn); background: transparent; padding: 4px 12px; cursor: pointer; border-radius: 4px; }
.detail .antwoord-groot { font-size: 18px; margin: 0 0 18px; padding: 12px 14px; background: var(--tafel); }
.detail .regel { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--lijn); }
.detail .regel > b { font-size: 15px; }
.detail .regel[data-stap="triage"] > b { color: var(--stempel); }
.detail .regel[data-stap="scoring"] > b { color: var(--rood); }
.detail .regel[data-stap="feedback"] > b { color: var(--groen); }
.detail .wie { font-size: 14px; color: var(--inkt-zacht); margin-top: 2px; }
.detail .hand { font-family: var(--hand); font-size: 19px; line-height: 1.3; }

/* ── lege toestand ───────────────────────────────────────────────────── */
.nog-niets { max-width: 620px; margin: 12vh auto; background: var(--papier); box-shadow: var(--schaduw); padding: 30px 34px; }
.nog-niets h1 { margin: 0 0 10px; font-size: 24px; }
.nog-niets p { margin: 0 0 10px; }
.nog-niets code { background: var(--tafel); padding: 2px 6px; border-radius: 3px; }

@keyframes knipper { 50% { opacity: .25; } }
@keyframes neerkomen { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } }

@media (max-width: 1180px) {
  .werkblad { grid-template-columns: 1fr; }
  .zij { position: static; display: grid; grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .estafette { grid-template-columns: 1fr 1fr; gap: 16px; }
  .loper { margin-right: 0; }
  .loper::after { display: none; }
}
@media (max-width: 600px) {
  .pagina { padding: 16px 16px 32px; }
  .kop { grid-template-columns: 1fr; }
  .klok { text-align: left; }
  .estafette { grid-template-columns: 1fr; }
  .zij { grid-template-columns: 1fr; }
  .briefing .blad { padding: 20px 18px; }
  .detail .regel { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="detail" aria-labelledby="detail-titel"><div class="detail" id="detail-inhoud"></div></dialog>

<script>
(function () {
  "use strict";
  const STAPPEN = ["triage", "scoring", "feedback", "briefing"];
  const WERKWOORD = { triage: "sorteert", scoring: "scoort", feedback: "schrijft feedback", briefing: "vat samen voor de docent" };
  const BEZIG_TEKST = { triage: "wordt gesorteerd", scoring: "wordt gescoord", feedback: "feedback wordt geschreven" };
  const app = document.getElementById("app");
  const dialoog = document.getElementById("detail");
  const dialoogInhoud = document.getElementById("detail-inhoud");

  let S = null;            // huidige toestand
  let vorige = {};         // per leerling: welke markeringen er al stonden (voor de neerkom-animatie)
  let laatsteJSON = "";
  let openId = null;
  let geladen = false;

  // ── hulpjes ──────────────────────────────────────────────────────────
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const kortModel = (m) => (m || "").replace(/^(CLUSTER|ERASMUS)\./, "");
  const nu = () => Date.now();
  const kantel = (id) => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 997; return ((h % 13) - 6) / 10; };
  const tagTekst = (t) => (t || "").replace(/^\[|\]$/g, "");

  // ── minimale markdown (koppen, lijsten, tabellen, citaat, vet/cursief) ─
  function inline(t) {
    return esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/(^|\W)_([^_\s][^_]*)_(?=\W|$)/g, "$1<em>$2</em>");
  }
  function markdown(src) {
    const regels = String(src || "").replace(/\r/g, "").split("\n");
    let html = "", i = 0;
    const isTabel = (r) => /^\s*\|.*\|\s*$/.test(r);
    while (i < regels.length) {
      const r = regels[i];
      if (!r.trim()) { i++; continue; }
      let m;
      if ((m = r.match(/^(#{1,4})\s+(.*)$/))) {
        const niveau = m[1].length <= 2 ? "h2" : "h3";
        html += `<div class="kopblok"><${niveau}>${inline(m[2])}</${niveau}></div>`; i++; continue;
      }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(r)) { html += "<hr>"; i++; continue; }
      if (isTabel(r)) {
        const rijen = [];
        while (i < regels.length && isTabel(regels[i])) { rijen.push(regels[i]); i++; }
        const cellen = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const kop = cellen(rijen[0]);
        const lijf = rijen.slice(1).filter((x) => !/^\s*\|?\s*:?-{2,}/.test(x));
        html += "<table><thead><tr>" + kop.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
          lijf.map((x) => "<tr>" + cellen(x).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
        continue;
      }
      if (/^\s*>/.test(r)) {
        const blok = [];
        while (i < regels.length && /^\s*>/.test(regels[i])) { blok.push(regels[i].replace(/^\s*>\s?/, "")); i++; }
        html += `<blockquote>${inline(blok.join(" "))}</blockquote>`; continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(r)) {
        const geordend = /^\s*\d+[.)]/.test(r);
        const items = [];
        while (i < regels.length && (/^\s*([-*+]|\d+[.)])\s+/.test(regels[i]) || (/^\s{2,}\S/.test(regels[i]) && items.length))) {
          const x = regels[i];
          if (/^\s*([-*+]|\d+[.)])\s+/.test(x)) items.push({ diep: /^\s{2,}/.test(x), t: x.replace(/^\s*([-*+]|\d+[.)])\s+/, "") });
          else items[items.length - 1].t += " " + x.trim();
          i++;
        }
        const tag = geordend ? "ol" : "ul";
        const begin = geordend ? parseInt(r.trim(), 10) || 1 : 1;
        html += `<${tag}${begin > 1 ? ` start="${begin}"` : ""}>` + items.map((it) => `<li${it.diep ? ' style="margin-left:18px;list-style:circle"' : ""}>${inline(it.t)}</li>`).join("") + `</${tag}>`;
        continue;
      }
      const alinea = [];
      while (i < regels.length && regels[i].trim() && !/^(#{1,4}\s|\s*>|\s*([-*+]|\d+[.)])\s+|\s*\|)/.test(regels[i])) { alinea.push(regels[i]); i++; }
      if (!alinea.length) { alinea.push(regels[i]); i++; }
      html += `<p>${inline(alinea.join(" "))}</p>`;
    }
    return html;
  }

  // ── tellingen ────────────────────────────────────────────────────────
  function tel(s) {
    const L = s.leerlingen;
    const getriageerd = L.filter((l) => l.triage);
    const geldig = L.filter((l) => l.triage === "GELDIG");
    const gescoord = L.filter((l) => l.score_s != null);
    const metFeedback = L.filter((l) => l.feedback_s != null);
    return {
      triage: { klaar: getriageerd.length, totaal: L.length },
      scoring: { klaar: gescoord.length, totaal: s.stappen.triage.status === "klaar" ? geldig.length : null },
      feedback: { klaar: metFeedback.length, totaal: s.stappen.scoring.status === "klaar" ? gescoord.length : null },
      briefing: { klaar: s.briefing ? 1 : 0, totaal: 1 },
      geldig: geldig.length, ongeldig: getriageerd.length - geldig.length, gescoord
    };
  }

  // ── weergave ─────────────────────────────────────────────────────────
  function render() {
    if (!S) {
      app.innerHTML = `<div class="nog-niets"><h1>Nog geen run gestart</h1>
        <p>Start de estafette in een terminal in deze map:</p>
        <p><code>python pipeline_live.py</code></p>
        <p>Of oefen zonder gateway: <code>python pipeline_live.py --simulatie</code></p>
        <p>Deze pagina werkt zichzelf bij zodra de run begint. Je hoeft niet te verversen.</p></div>`;
      return;
    }
    const t = tel(S);
    const verstreken = (S.klaar_op || nu()) - S.gestart;
    const statusTekst = S.status === "klaar" ? "klaar" : S.status === "fout" ? "gestopt door een fout" : (S.modus === "simulatie" ? "simulatie loopt" : "live");

    let html = `<div class="pagina">
      <header class="kop">
        <div><h1>Nakijk-estafette: exit-ticket waterkringloop</h1>
          <p class="vraag">${esc(S.vraag)}</p></div>
        <div class="klok"><div class="tijd" id="klok">${mmss(verstreken)}</div>
          <div class="status ${esc(S.status)}"><span class="punt"></span>${esc(statusTekst)}</div></div>
        ${S.modus === "simulatie" ? `<div class="sim-melding">Simulatie: dit speelt opgenomen modelantwoorden na, er draait nu geen model.</div>` : ""}
        ${S.status === "fout" ? `<div class="sim-melding" style="color:var(--fout);border-color:var(--fout)">${esc(S.fout)}</div>` : ""}
      </header>
      <section class="estafette" aria-label="De vier modellen in de estafette">${STAPPEN.map((k) => loper(k, t)).join("")}</section>
      <div class="werkblad">
        <section aria-labelledby="kop-tickets">
          <div class="sectiekop"><h2 id="kop-tickets">De klas: ${S.leerlingen.length} exit-tickets</h2>
            <p>${t.ongeldig ? `${t.ongeldig} apart gelegd` : "Klik op een ticket voor alle details"}</p></div>
          <div class="tickets">${S.leerlingen.map(ticket).join("")}</div>
        </section>
        <aside class="zij">${controle()}${klasbeeld(t)}${logboek()}</aside>
      </div>
      ${briefingBlok()}
    </div>`;
    app.innerHTML = html;
    if (openId) vulDetail(openId);
  }

  function loper(k, t) {
    const st = S.stappen[k];
    const v = t[k];
    const model = st.gebruikt || st.probeert || st.bedoeld;
    const vervangen = st.gebruikt && st.gebruikt !== st.bedoeld;
    const pct = v.totaal ? Math.round((100 * v.klaar) / v.totaal) : 0;
    const duur = st.status === "klaar" ? mmss(st.duur * 1000) : st.status === "bezig" && st.gestart ? mmss(nu() - st.gestart) : "";
    const statusLabel = st.status === "klaar" ? `klaar in ${duur}` : st.status === "bezig" ? `aan het werk, <span data-sinds="${st.gestart}">${duur}</span>` : "wacht op het stokje";
    let extra = "";
    const veld = { triage: "triage_model", scoring: "score_model", feedback: "feedback_model" }[k];
    const anderen = {};
    if (veld) S.leerlingen.forEach((l) => { const m = l[veld]; if (m && m !== model && !m.startsWith("voorfilter")) anderen[m] = (anderen[m] || 0) + 1; });
    const ookTekst = Object.entries(anderen).map(([m, n]) => `${esc(kortModel(m))} ${n}×`).join(", ");
    if (vervangen) extra = `<div class="vervangt">valt in voor <s>${esc(kortModel(st.bedoeld))}</s></div>`;
    else if (st.status === "bezig" && !st.gebruikt && st.uitgevallen.length) extra =`<div class="vervangt">${esc(kortModel(st.uitgevallen[st.uitgevallen.length - 1].model))} viel uit</div>`;
    if (ookTekst) extra += `<div class="vervangt">ook ingevallen: ${ookTekst}</div>`;
    return `<article class="loper ${esc(st.status)}" data-stap="${k}">
      <div class="naam"><strong>${esc(st.naam)}</strong><span>${WERKWOORD[k]}</span></div>
      <div class="model">${esc(kortModel(model))}</div>${extra}
      <div class="voortgang"><div class="balk"><i style="width:${pct}%"></i></div>
        <div class="teller"><span><b>${v.klaar}</b>${v.totaal != null ? " / " + v.totaal : ""}</span><span>${statusLabel}</span></div></div>
    </article>`;
  }

  function afwijkingen(l) {
    const v = l.verwacht || {};
    const uit = [];
    if (l.triage && v.triage && l.triage !== v.triage) uit.push(`verwacht ${v.triage}`);
    if (l.score_s != null && v.score != null && l.score !== v.score) uit.push(`verwacht ${v.score}/2`);
    return uit;
  }

  function ticket(l) {
    const was = vorige[l.id] || {};
    const net = (sleutel, nuAanwezig) => (nuAanwezig && !was[sleutel] && geladen ? " net" : "");
    const leeg = !(l.antwoord || "").trim();
    const klassen = ["ticket"];
    if (l.actief) klassen.push("actief-" + l.actief);
    if (l.triage === "ONGELDIG") klassen.push("ongeldig");
    const af = afwijkingen(l);
    if (af.length) klassen.push("wijkt-af");
    const score = l.score_s != null ? `<div class="score${net("score", true)}" aria-label="score ${l.score == null ? "onleesbaar" : l.score + " van 2"}">${l.score == null ? "?" : l.score + "/2"}</div>` : "";
    const doorRegel = (l.triage_model || "").startsWith("voorfilter");
    const stempel = l.triage ? `<span class="stempel${doorRegel ? " regel" : ""}${net("triage", true)}">${esc(l.triage)}</span>${doorRegel ? `<div class="regel-uitleg">vaste regel, geen model</div>` : ""}` : "";
    const tag = l.score_s != null && l.fout_tag ? `<div class="tag${net("tag", true)}">${esc(tagTekst(l.fout_tag))}</div>` : "";
    const fb = l.feedback_s != null ? `<div class="feedback${net("feedback", true)}">${esc(l.feedback)}</div>` : "";
    const bezig = l.actief ? `<div class="bezig-label"><span>${BEZIG_TEKST[l.actief]}</span> <span data-sinds="${l.actief_sinds}">${mmss(nu() - l.actief_sinds)}</span></div>` : "";
    return `<button class="${klassen.join(" ")}" style="--kantel:${kantel(l.id)}deg" data-id="${esc(l.id)}" aria-label="Exit-ticket ${esc(l.id)}">
      <div class="boven"><div><div class="lid">${esc(l.id)}</div>${stempel}</div>${score}</div>
      <div class="antwoord${leeg ? " leeg" : ""}">${leeg ? "(leeg ingeleverd)" : esc(l.antwoord)}</div>
      ${af.length ? `<div class="afwijking">≠ ${esc(af.join(", "))}</div>` : ""}${tag}${fb}${bezig}
    </button>`;
  }

  function controle() {
    const L = S.leerlingen.filter((l) => l.verwacht);
    if (!L.length) return "";
    const tri = L.filter((l) => l.triage);
    const triGoed = tri.filter((l) => l.triage === l.verwacht.triage);
    const sc = L.filter((l) => l.score_s != null && l.verwacht.score != null);
    const scGoed = sc.filter((l) => l.score === l.verwacht.score);
    const mis = (lijst, goed) => lijst.filter((l) => !goed.includes(l)).map((l) => l.id).join(", ");
    const regel = (naam, goed, lijst) => !lijst.length ? `<div class="check"><span>${naam}</span><b>—</b></div>` :
      `<div class="check"><span>${naam}</span><b>${goed.length} / ${lijst.length}</b>${goed.length < lijst.length ? `<span class="mis">mis: ${esc(mis(lijst, goed))}</span>` : ""}</div>`;
    return `<section class="paneel"><h2>Klopt het?</h2><p class="uitleg">Vergeleken met de verwachte uitkomst per leerling.</p>
      ${regel("Triage (voorfilter + Tev1)", triGoed, tri)}${regel("Score (Nimble)", scGoed, sc)}</section>`;
  }

  function klasbeeld(t) {
    const g = t.gescoord.filter((l) => l.score != null);
    if (!g.length) return `<section class="paneel"><h2>Klasbeeld</h2><p class="leeg-melding">Verschijnt zodra Nimble de eerste scores geeft.</p></section>`;
    const gem = (g.reduce((a, l) => a + l.score, 0) / g.length).toFixed(2).replace(".", ",");
    const verdeling = [2, 1, 0].map((s) => ({ label: s === 2 ? "2 punten, volledig" : s === 1 ? "1 punt, deels" : "0 punten, nog niet", n: g.filter((l) => l.score === s).length }));
    const tags = {};
    t.gescoord.forEach((l) => { const k = tagTekst(l.fout_tag); if (k) tags[k] = (tags[k] || 0) + 1; });
    const tagRijen = Object.entries(tags).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...verdeling.map((v) => v.n), ...tagRijen.map((x) => x[1]));
    const staaf = (label, n) => `<div class="staaf"><span class="label">${esc(label)}</span><span class="spoor"><i style="width:${(100 * n) / max}%"></i></span><span class="getal">${n}</span></div>`;
    return `<section class="paneel"><h2>Klasbeeld</h2>
      <div class="kengetal"><div><b>${gem}</b>gemiddeld van 2</div><div><b>${g.length}</b>gescoord</div><div><b>${t.ongeldig}</b>apart gelegd</div></div>
      ${verdeling.map((v) => staaf(v.label, v.n)).join("")}
      <h2 style="margin-top:18px">Fouten</h2>
      ${tagRijen.map(([k, n]) => staaf(k, n)).join("")}
    </section>`;
  }

  function logboek() {
    const items = S.log.slice(-80).reverse();
    return `<section class="paneel"><h2>Logboek</h2>
      <ol class="logboek">${items.map((e) => `<li class="${esc(e.soort)}" data-stap="${esc(e.stap || "")}"><time>${mmss(e.t - S.gestart)}</time><span class="tekst">${esc(e.tekst)}</span></li>`).join("")}</ol></section>`;
  }

  function briefingBlok() {
    const st = S.stappen.briefing;
    let inhoud;
    if (S.briefing) {
      inhoud = `<div class="md">${markdown(S.briefing.markdown)}</div>
        <p class="bron">${S.briefing.lokaal ? "Qwen was niet bereikbaar; dit is de vaste reserve-briefing." : `Geschreven door ${esc(kortModel(S.briefing.model))} op basis van de scores en fout-tags hierboven.`}</p>`;
    } else if (st.status === "bezig") {
      inhoud = `<p class="wacht">Qwen leest alle scores en feedback en schrijft de briefing…</p>`;
    } else {
      inhoud = `<p class="wacht">Qwen schrijft de briefing zodra alle feedback binnen is.</p>`;
    }
    return `<section class="briefing" aria-labelledby="kop-briefing"><div class="sectiekop"><h2 id="kop-briefing">Docent-briefing</h2></div><div class="blad">${inhoud}</div></section>`;
  }

  // ── detailvenster ────────────────────────────────────────────────────
  function vulDetail(id) {
    const l = S.leerlingen.find((x) => x.id === id);
    if (!l) return;
    const leeg = !(l.antwoord || "").trim();
    const wie = (model, sec) => model ? `<div class="wie">${esc(kortModel(model))}${sec ? `, ${String(sec).replace(".", ",")} s` : ""}</div>` : "";
    const regel = (stap, titel, inhoud) => `<div class="regel" data-stap="${stap}"><b>${titel}</b><div>${inhoud}</div></div>`;
    let h = `<header><h2 id="detail-titel">Exit-ticket ${esc(l.id)}</h2><button class="sluit" type="button" data-sluit>Sluiten</button></header>
      <p class="antwoord-groot">${leeg ? "<em>(leeg ingeleverd)</em>" : esc(l.antwoord)}</p>`;
    const v = l.verwacht;
    if (v) h += regel("", "Verwacht", `<span>${esc(v.triage)}${v.score != null ? `, ${v.score}/2` : ""}</span>${afwijkingen(l).length ? ` <span class="afwijking">wijkt af</span>` : ""}`);
    h += regel("triage", "Tev1", l.triage ? `<span class="stempel${(l.triage_model || "").startsWith("voorfilter") ? " regel" : ""}">${esc(l.triage)}</span>${l.triage_reden ? ` <span class="wie">(${esc(l.triage_reden)})</span>` : ""}${wie(l.triage_model, l.triage_s)}` : "<span class=wie>nog niet gesorteerd</span>");
    if (l.triage !== "ONGELDIG") {
      h += regel("scoring", "Nimble", l.score_s != null ? `<span class="hand" style="color:var(--rood)">${l.score == null ? "onleesbaar" : l.score + "/2"}, ${esc(tagTekst(l.fout_tag))}</span>${wie(l.score_model, l.score_s)}` : "<span class=wie>nog niet gescoord</span>");
      h += regel("feedback", esc(S.stappen.feedback.naam), l.feedback_s != null ? `<div class="hand" style="color:var(--groen)">${esc(l.feedback)}</div>${wie(l.feedback_model, l.feedback_s)}` : "<span class=wie>nog geen feedback</span>");
    } else {
      h += regel("scoring", "", `<span class="wie">Apart gelegd: dit ticket gaat niet door naar scoring en feedback.</span>`);
    }
    dialoogInhoud.innerHTML = h;
  }
  app.addEventListener("click", (e) => {
    const knop = e.target.closest(".ticket");
    if (!knop) return;
    openId = knop.dataset.id; vulDetail(openId);
    if (!dialoog.open) dialoog.showModal();
  });
  dialoog.addEventListener("click", (e) => { if (e.target === dialoog || e.target.closest("[data-sluit]")) dialoog.close(); });
  dialoog.addEventListener("close", () => { openId = null; });

  // ── klok: tikt tussen updates door ───────────────────────────────────
  setInterval(() => {
    if (!S) return;
    const k = document.getElementById("klok");
    if (k && S.status === "bezig") k.textContent = mmss(nu() - S.gestart);
    document.querySelectorAll("[data-sinds]").forEach((el) => { const s = +el.dataset.sinds; if (s) el.textContent = mmss(nu() - s); });
  }, 500);

  // ── gegevens binnenhalen ─────────────────────────────────────────────
  function ontvang(s) {
    const j = JSON.stringify(s);
    if (j === laatsteJSON) return;
    if (S && s.run_id !== S.run_id) { vorige = {}; geladen = false; }   // nieuwe run gestart
    laatsteJSON = j; S = s;
    const scrollY = window.scrollY;
    const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null;
    const logScroll = (document.querySelector(".logboek") || {}).scrollTop || 0;
    render();
    window.scrollTo(0, scrollY);
    const lb = document.querySelector(".logboek"); if (lb) lb.scrollTop = logScroll;
    if (focusId) { const el = app.querySelector(`.ticket[data-id="${focusId}"]`); if (el) el.focus({ preventScroll: true }); }
    vorige = {};
    S.leerlingen.forEach((l) => { vorige[l.id] = { triage: !!l.triage, score: l.score_s != null, tag: l.score_s != null, feedback: l.feedback_s != null }; });
    geladen = true;
  }
  window.__clefState = ontvang;

  if (window.__clefInline) {            // momentopname na afloop: geen polling
    ontvang(window.__clefInline);
    return;
  }
  render();
  function haal() {
    const sc = document.createElement("script");
    sc.src = "live_state.js?t=" + nu();
    sc.onload = sc.onerror = () => sc.remove();
    document.head.appendChild(sc);
  }
  haal();
  setInterval(haal, 1000);
})();
</script>
</body>
</html>

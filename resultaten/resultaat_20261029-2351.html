<script>window.__clefInline = {"versie": 1, "run_id": 1793312543033, "modus": "live", "bron": null, "status": "klaar", "gestart": 1793312543033, "klaar_op": 1793314319920, "fout": null, "vraag": "Leg in maximaal 3 zinnen uit hoe de waterkringloop werkt. Noem minimaal drie fasen.", "endpoint": "https://chat.nolai.nl/api/v1", "stappen": {"triage": {"naam": "Tev1", "rol": "Triage: [GELDIG] / [ONGELDIG]", "bedoeld": "ERASMUS.tev1:4b", "kandidaten": ["ERASMUS.tev1:4b", "ERASMUS.tev1:0.8b", "CLUSTER.nimble:9b"], "probeert": "ERASMUS.tev1:4b", "gebruikt": "ERASMUS.tev1:0.8b", "uitgevallen": [{"model": "ERASMUS.tev1:4b", "reden": "HTTP 400 Error code: 400 - {'detail': '\"tev1:4b\" does not support chat'}"}, {"model": "ERASMUS.tev1:0.8b", "reden": "onbruikbaar antwoord"}, {"model": "CLUSTER.nimble:9b", "reden": "onbruikbaar antwoord"}], "status": "klaar", "gestart": 1793312543288, "duur": 744.4}, "scoring": {"naam": "Nimble", "rol": "Scoring 0–2 + fout-tag", "bedoeld": "CLUSTER.nimble:9b", "kandidaten": ["CLUSTER.nimble:9b", "CLUSTER.ornith-1.5:35b"], "probeert": "CLUSTER.ornith-1.5:35b", "gebruikt": "CLUSTER.ornith-1.5:35b", "uitgevallen": [{"model": "CLUSTER.nimble:9b", "reden": "onbruikbaar antwoord"}], "status": "klaar", "gestart": 1793313287662, "duur": 793.3}, "feedback": {"naam": "Clef", "rol": "Empathische formatieve feedback", "bedoeld": "CLUSTER.clef:27b", "kandidaten": ["CLUSTER.clef:27b", "CLUSTER.ornith-1.5:35b"], "probeert": "CLUSTER.ornith-1.5:35b", "gebruikt": "CLUSTER.ornith-1.5:35b", "uitgevallen": [{"model": "CLUSTER.clef:27b", "reden": "HTTP 400 Error code: 400 - {'detail': '\"clef:27b\" does not support chat'}"}], "status": "klaar", "gestart": 1793314080968, "duur": 137.0}, "briefing": {"naam": "Qwen3.8", "rol": "Docent-briefing + actieplan", "bedoeld": "CLUSTER.qwen3.8:latest", "kandidaten": ["CLUSTER.qwen3.8:latest"], "probeert": "CLUSTER.qwen3.8:latest", "gebruikt": "CLUSTER.qwen3.8:latest", "uitgevallen": [], "status": "klaar", "gestart": 1793314217992, "duur": 101.9}}, "leerlingen": [{"id": "L01", "antwoord": "Water verdampt door de warmte van de zon, kondenseert in de hoge lucht tot wolken en valt als neerslag, regen of sneeuw, terug op aarde.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 31.4, "score": 2, "fout_tag": "[Geen fout]", "score_model": "CLUSTER.nimble:9b", "score_s": 31.0, "feedback": "Je hebt de watercyclus heel goed beschreven: door de zon verdampt het water, vormt het in de hoge lucht wolken en valt het terug als neerslag. Je begrijpt dit proces goed, ga zo door!", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 5.5}, {"id": "L02", "antwoord": "De waterkringloop bestaat uit verdamping, condensatie en neerslag. Water stoomt op uit zeeën, wordt wolken en regent of sneuvelt weer naar beneden.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 48.0, "score": 2, "fout_tag": "[Geen fout]", "score_model": "CLUSTER.nimble:9b", "score_s": 58.0, "feedback": "Je hebt de waterkringloop heel goed begrepen: je noemt de drie belangrijkste stappen in de goede volgorde en begrijpt dat water vanuit de zee omhoog gaat en weer naar beneden komt. Wil je bij het omschrijven van die eerste stap nog wat letten op de woordkeuze — het heet 'verdamping' en niet dat het water 'stoomt', want water verandert langzaam van vloeistof naar gas in plaats van dat het stoot.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 15.9}, {"id": "L03", "antwoord": "Het water gaat omhoog als damp, maakt wolken en dan regent het weer.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 39.1, "score": 2, "fout_tag": "[Geen fout]", "score_model": "CLUSTER.nimble:9b", "score_s": 35.1, "feedback": "Wat goed dat je de watersikkel zo correct weergeeft: water verdampt als damp, vormt wolken en neert daarna weer als regen. Voor je volgende stap kan je proberen de zon als energiebron te noemen en de namen evaporatie, condensatie en neerslag toe te voegen.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 21.8}, {"id": "L04", "antwoord": "Water verdamp en dan regent het weer op de grond.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 50.2, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.nimble:9b", "score_s": 43.1, "feedback": "Goed dat je de verdamping en de neerslag noemt! Er ontbreekt nog een stap tussenin: als de waterdamp in de lucht afkoelt, verandert het in kleine watertjes die samen een wolken vormen - dat noem je condensatie. Voeg die stap toe, dan is de waterkringloop compleet.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 26.2}, {"id": "L05", "antwoord": "Eerst valt er neerslag uit de lucht en daarna verdampt het water weer in de oceaan.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 79.5, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.nimble:9b", "score_s": 287.5, "feedback": "Je hebt goed dat neerslag en verdamping een deel van de cyclus zijn, maar je vergeet nog een belangrijke schakel ertussen: voordat de neerslag valt, moet het waterdamp in de lucht eerst condensen tot wolken. Probeer daarom te benoemen wat er gebeurt voordat het regent, en where dat gebeurt.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 14.7}, {"id": "L06", "antwoord": "De zon verwarmt het water in de zee en dat komt omhoog als wolken in de lucht.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 80.3, "score": 1, "fout_tag": "[Vergeet neerslag]", "score_model": "CLUSTER.nimble:9b", "score_s": 70.8, "feedback": "Je beschrijft de verdamping heel goed: de zon verwarmt het zeewater en dat stijgt als damp op in de lucht. De volgende stap is om te bedenken wat er gebeurt wanneer die damp bovenin de lucht weer afkoelt en als regen of sneeuw naar de aal terugvalt — neerslag dus.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 16.8}, {"id": "L07", "antwoord": "Wolken vallen uit de lucht en dan stroomt het water in de zee.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 81.7, "score": 1, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 419.0, "feedback": "Regen valt uit de wolken, niet de wolken zelf: het waterdamp in wolken koelt af en vormt druppels die als regen naar de aarde komen, en dat water stroomt daarna naar de zee.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 6.9}, {"id": "L08", "antwoord": "Het water stroomt via rivieren naar de zee en komt dan weer terug in de lucht.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 61.2, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 411.6, "feedback": "Je hebt goed dat water via rivieren naar de zee stroomt en terug in de lucht komt, maar vergeet je de condensatie — als de watervapor afkoelt, vormt het wolken voordat het als regen naar de aal valt. Probeer volgende keer eens te beschrijven wat er gebeurt voordat het regent.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 13.8}, {"id": "L09", "antwoord": "Als het warm is dan verdampt het water en dat wordt dan wind die de wolken door de lucht duwt.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 71.2, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 37.5, "feedback": "Goed dat je het verdampt water als eerste stap noemt, maar let op: het waterdamp wordt niet wind die de wolken door de lucht duwt, het waterdamp stijgt juist op en koelt dan af. De stap die je nog mist, is condensatie, waarbij die damp verandert in kleine druppeltjes die samen de wolk vormen.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 32.5}, {"id": "L10", "antwoord": "De waterkringloop is een soort kring van water die altijd door blijft gaan.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 44.3, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 16.5, "feedback": "Je hebt goed dat de waterkringloop blijvend doorgaat, maar door het enkel een kring te noemen, vertel je nog niet wat er werkelijk gebeurt. Probeer nu te benoemen hoe het water verandert en beweegt: via verdamping, condensatie en neerslag tussen de aarde, de lucht en de zee.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 25.8}, {"id": "L11", "antwoord": "Ik denk dat het te maken heeft met de maan, want het water gaat omhoog en omlaag.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 37.2, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 8.6, "feedback": "Je hebt gelijk dat de maan een rol speelt bij het omhoog en omlaag gaan van het water dat we getij noemen; de volgende stap is om uit te leggen hóe dit gebeurt: de zwaartekracht van de maan trekt het water aan, waardoor hoogwater en laagwater ontstaan.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 39.2}, {"id": "L12", "antwoord": "Omdat vissen het water in de lucht duwen met hun staarten.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 204.2, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 7.8, "feedback": "Je denkt hier duidelijk goed mee na over hoe vissen met hun omgeving omgaan, maar vissen duwen hun staart niet in de lucht — je zou nog eens kunnen bekijken hoe vissen zich écht verplaatsen en zuurstof opnemen in het water.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 14.8}, {"id": "L13", "antwoord": "De waterkringloop bestaat omdat het water honger heeft naar de aarde.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 350.5, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 7.4, "feedback": "Wat een creatieve gedachte, maar water heeft gelukkig geen honger - de waterkringloop wordt juist aangejaagd door de warmte van de zon en de zwaarte kracht. Denk eens na welke natuurlijke krachten het water naar boven tillen en weer naar beneden trekken.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 22.2}, {"id": "L14", "antwoord": "Waternoom is een dier dat in de zee woont en dat spuilt dan het water de lucht in.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 526.9, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 6.3, "feedback": "Goed dat je de waternoom herkint als een klein dier dat in het water leeft. Let op: de waternoom spuit geen water in de lucht, maar vangt zijn prooi met de kleine tentakels rond zijn mond — bekijk nog eens hoe hij zich voedt.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 48.3}, {"id": "L15", "antwoord": "Omdat de zon 's nachts het water drinkt en 's ochtends weer brukt op de aarde.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 37.0, "score": 0, "fout_tag": "[Begripsfout]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 11.2, "feedback": "Je hebt alvast goed dat de zon een belangrijke rol speelt bij het verplaatsen van water, maar hij drinkt het niet en spit het ook niet terug — door de warmte van de zon verdampt het water en stijgt het als damp de lucht in. Pak de volgende keer eens aan wat er met het water gebeurt als de zon het warm maakt.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 21.4}, {"id": "L16", "antwoord": "1234567890", "actief": null, "actief_sinds": null, "triage": "ONGELDIG", "triage_model": "voorfilter (vaste regel)", "triage_reden": "geen tekst, alleen cijfers of tekens", "triage_s": 0.0}, {"id": "L17", "antwoord": "", "actief": null, "actief_sinds": null, "triage": "ONGELDIG", "triage_model": "voorfilter (vaste regel)", "triage_reden": "leeg antwoord", "triage_s": 0.0}, {"id": "L18", "antwoord": "In de zee wordt water verdampt en dan regent het weer op de bergen.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 16.6, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 5.8, "feedback": "Goed dat je ziet dat het water uit de zee verdampt en als regen op de landen neerkomt! Voor die regen moet het verdampt water eerst afkoelen en zich veranderen in wolken — noem dat proces maar bij de naam.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 22.2}, {"id": "L19", "antwoord": "Het water loopt langzaam de berg op en dan valt het er weer van af als regen.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "ERASMUS.tev1:0.8b", "triage_s": 20.3, "score": 1, "fout_tag": "[Vergeet condensatie]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 21.5, "feedback": "Je hebt de verdamping en de regen prima genoemd, maar je bent de condensatie vergeten: als het waterdamp in de hoogte stijgt, koelt het af en condenseert het tot wolken, en pas dan valt het als regen naar beneden.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 30.9}, {"id": "L20", "antwoord": "Iets met wolken en regen, maar ik weet de fases niet echt te benoemen.", "actief": null, "actief_sinds": null, "triage": "GELDIG", "triage_model": "CLUSTER.nimble:9b", "triage_s": 69.4, "score": 1, "fout_tag": "[Vergeet verdamping]", "score_model": "CLUSTER.ornith-1.5:35b", "score_s": 79.9, "feedback": "Je hebt al goed dat er wolken en regen bij komen kijken — dat is zeker een deel van de watersnelheid. De volgende stap is om ook de andere fasen te benoemen, met name de verdamping waar water door verandert in damp en de lucht in stijgt.", "feedback_model": "CLUSTER.ornith-1.5:35b", "feedback_s": 22.6}], "log": [{"t": 1793312543033, "stap": null, "soort": "info", "tekst": "Run gestart: 20 exit-tickets"}, {"t": 1793312543288, "stap": "triage", "soort": "stokje", "tekst": "Tev1 neemt het stokje over"}, {"t": 1793312544061, "stap": "triage", "soort": "wissel", "tekst": "ERASMUS.tev1:4b valt uit (HTTP 400 Error code: 400 - {'detail': '\"tev1:4b\" does not support chat'}) → substitute: ERASMUS.tev1:0.8b"}, {"t": 1793312810903, "stap": "triage", "soort": "info", "tekst": "ERASMUS.tev1:0.8b: 'denk-fase' onafgemaakt → gebruikte laatste regel van redenering"}, {"t": 1793312810904, "stap": "triage", "soort": "info", "tekst": "ERASMUS.tev1:0.8b: antwoord onbruikbaar voor deze taak → volgende kandidaat"}, {"t": 1793312947286, "stap": "triage", "soort": "info", "tekst": "CLUSTER.nimble:9b: 'denk-fase' onafgemaakt → gebruikte laatste regel van redenering"}, {"t": 1793312947287, "stap": "triage", "soort": "info", "tekst": "CLUSTER.nimble:9b: antwoord onbruikbaar voor deze taak → volgende kandidaat"}, {"t": 1793313071397, "stap": "triage", "soort": "info", "tekst": "ERASMUS.tev1:0.8b: 'denk-fase' onafgemaakt → gebruikte laatste regel van redenering"}, {"t": 1793313071399, "stap": "triage", "soort": "info", "tekst": "ERASMUS.tev1:0.8b: antwoord onbruikbaar voor deze taak → volgende kandidaat"}, {"t": 1793313151320, "stap": "triage", "soort": "info", "tekst": "ERASMUS.tev1:0.8b: 'denk-fase' onafgemaakt → gebruikte laatste regel van redenering"}, {"t": 1793313151321, "stap": "triage", "soort": "info", "tekst": "ERASMUS.tev1:0.8b: antwoord onbruikbaar voor deze taak → volgende kandidaat"}, {"t": 1793313287530, "stap": "triage", "soort": "info", "tekst": "CLUSTER.nimble:9b: itute: CLUSTER.ornith-1.5:35b"}, {"t": 1793314217991, "stap": "feedback", "soort": "klaar", "tekst": "Clef klaar in 2:17"}, {"t": 1793314217992, "stap": "briefing", "soort": "stokje", "tekst": "Qwen3.8 neemt het stokje over"}, {"t": 1793314319918, "stap": "briefing", "soort": "klaar", "tekst": "Qwen3.8 klaar in 1:42"}, {"t": 1793314319920, "stap": null, "soort": "klaar", "tekst": "Estafette klaar in 29:37"}], "briefing": {"markdown": "## Samenvatting klasprestaties\n\n- **20 leerlingen** deden mee; **18 tickets** zijn geldig, **2 ongeldig** (L16, L17).\n- Gemiddelde score: **0,83 / 2**.\n- Verdeling: **6 leerlingen** scoren 0, **9 leerlingen** scoren 1, **3 leerlingen** scoren 2 (L01, L02, L03).\n- Alleen 3 van de 18 geldige tickets bevatten een volledig correct antwoord met alle drie de fasen (verdamping → condensatie → neerslag).\n\n## Veelvoorkomende misvattingen\n\n| Fout-tag | Aantal | Korte toelichting |\n|---|---|---|\n| [Begripsfout] | 7 | Leerlingen beschrijven de kringloop niet als fysiek proces met fasen, maar als willekeurige of levendige handeling (zon \"drinkt\" water, vissen duwen water omhoog, waternoom spuit water, wolken \"vallen\", water heeft \"honger\", verwarring met getij/maan). |\n| [Vergeet condensatie] | 6 | Verdamping en neerslag worden genoemd, maar de tussenstap (afkoeling → wolkvorming) ontbreekt. De volgorde wordt soms omgekeerd of de condensatie volledig overgeslagen. |\n| [Vergeet neerslag] | 1 | De cyclus stopt bij \"wolken in de lucht\"; het terugvallen op aarde ontbreekt. |\n| [Vergeet verdamping] | 1 | Leerling herkent wolken en regen, maar kan de initiële verdamping niet benoemen. |\n\n**Kernbeeld:** de meest frequente lacune is de **condensatiestap** (6×), gevolgd door **fundamentele begripsfouten** (7×) waarin de rol van zon, zwaartekracht en fase-overgang ontbreekt.\n\n## Voorstel opening volgende les\n\n**\"De ontbrekende schakel\" – 8 minuten, in duo's**\n\n1. **Boord / diavoorbeeld (1 min):** teken of projecteer een minimalistisch schematische cirkel met twee pijlen:\n   - Pijl 1 (opwaarts, gelabeld: *verdamping – zon verwarmt water*)\n   - Pijl 2 (neerwaarts, gelabeld: *neerslag – regen/sneeuw valt op aarde*)\n   - Pijl 3 (middenboven, **streeppijl, ongelabeld**)\n2. **Opdracht duo (3 min):** \"Schrijf op een post-it wat er in die streeppijl gebeurt, in maximaal twee zinnen, en noem de naam van de fase.\" Beide duo's plakken hun post-its op het bord.\n3. **Quick check (2 min):** kies 2-3 post-its (zowel correct als met een typische fout, bijv. \"het wordt wolken\" vs. \"de zon blaast het omhoog\"). Laat de rest van de klas in 10 seconden duimen omhoog/omlaag: klopt het?\n4. **Sluitaf docent (2 min):** formuleer samen de juiste volgorde én de *fysica* erachter (zon → energietoename → damp stijgt → afkoeling → condensatie → druppels → zwaartekracht → neerslag). Maak de rol van de **zon als energiebron** en de **zwaartekracht als motor voor neerslag** expliciet, want die ontbreten bij de 7 begripsfouten.\n\n> **Waarom dit werkt:** de activiteit forceert de 6 leerlingen die condensatie vergeten om die stap *zelf* te formuleren, en de 7 met begripsfouten moeten binnen 3 minuten een fysiek mechanisme noemen in plaats van een levendige metafoor. De peer-feedback (duimtest) maakt de correcte volgorde zonder extra uitleg zichtbaar.", "model": "CLUSTER.qwen3.8:latest", "lokaal": false, "payload": {"exit_ticket_vraag": "Leg in maximaal 3 zinnen uit hoe de waterkringloop werkt. Noem minimaal drie fasen.", "klas": {"aantal_leerlingen": 20, "geldig": 18, "ongeldig": 2, "ongeldige_ids": ["L16", "L17"]}, "scores": {"gemiddeld": 0.83, "verdeling": {"0": 6, "1": 9, "2": 3}}, "fout_tags": {"[Begripsfout]": 7, "[Vergeet condensatie]": 6, "[Geen fout]": 3, "[Vergeet neerslag]": 1, "[Vergeet verdamping]": 1}, "leerlingen": [{"id": "L01", "score": 2, "fout_tag": "[Geen fout]", "antwoord": "Water verdampt door de warmte van de zon, kondenseert in de hoge lucht tot wolken en valt als neerslag, regen of sneeuw, terug op aarde.", "feedback": "Je hebt de watercyclus heel goed beschreven: door de zon verdampt het water, vormt het in de hoge lucht wolken en valt het terug als neerslag. Je begrijpt dit proces goed, ga zo door!"}, {"id": "L02", "score": 2, "fout_tag": "[Geen fout]", "antwoord": "De waterkringloop bestaat uit verdamping, condensatie en neerslag. Water stoomt op uit zeeën, wordt wolken en regent of sneuvelt weer naar beneden.", "feedback": "Je hebt de waterkringloop heel goed begrepen: je noemt de drie belangrijkste stappen in de goede volgorde en begrijpt dat water vanuit de zee omhoog gaat en weer naar beneden komt. Wil je bij het omschrijven van die eerste stap nog wat letten op de woordkeuze — het heet 'verdamping' en niet dat het water 'stoomt', want water verandert langzaam van vloeistof naar gas in plaats van dat het stoot."}, {"id": "L03", "score": 2, "fout_tag": "[Geen fout]", "antwoord": "Het water gaat omhoog als damp, maakt wolken en dan regent het weer.", "feedback": "Wat goed dat je de watersikkel zo correct weergeeft: water verdampt als damp, vormt wolken en neert daarna weer als regen. Voor je volgende stap kan je proberen de zon als energiebron te noemen en de namen evaporatie, condensatie en neerslag toe te voegen."}, {"id": "L04", "score": 1, "fout_tag": "[Vergeet condensatie]", "antwoord": "Water verdamp en dan regent het weer op de grond.", "feedback": "Goed dat je de verdamping en de neerslag noemt! Er ontbreekt nog een stap tussenin: als de waterdamp in de lucht afkoelt, verandert het in kleine watertjes die samen een wolken vormen - dat noem je condensatie. Voeg die stap toe, dan is de waterkringloop compleet."}, {"id": "L05", "score": 1, "fout_tag": "[Vergeet condensatie]", "antwoord": "Eerst valt er neerslag uit de lucht en daarna verdampt het water weer in de oceaan.", "feedback": "Je hebt goed dat neerslag en verdamping een deel van de cyclus zijn, maar je vergeet nog een belangrijke schakel ertussen: voordat de neerslag valt, moet oed dat de waterkringloop blijvend doorgaat, maar door het enkel een kring te noemen, vertel je nog niet wat er werkelijk gebeurt. Probeer nu te benoemen hoe het water verandert en beweegt: via verdamping, condensatie en neerslag tussen de aarde, de lucht en de zee."}, {"id": "L11", "score": 0, "fout_tag": "[Begripsfout]", "antwoord": "Ik denk dat het te maken heeft met de maan, want het water gaat omhoog en omlaag.", "feedback": "Je hebt gelijk dat de maan een rol speelt bij het omhoog en omlaag gaan van het water dat we getij noemen; de volgende stap is om uit te leggen hóe dit gebeurt: de zwaartekracht van de maan trekt het water aan, waardoor hoogwater en laagwater ontstaan."}, {"id": "L12", "score": 0, "fout_tag": "[Begripsfout]", "antwoord": "Omdat vissen het water in de lucht duwen met hun staarten.", "feedback": "Je denkt hier duidelijk goed mee na over hoe vissen met hun omgeving omgaan, maar vissen duwen hun staart niet in de lucht — je zou nog eens kunnen bekijken hoe vissen zich écht verplaatsen en zuurstof opnemen in het water."}, {"id": "L13", "score": 0, "fout_tag": "[Begripsfout]", "antwoord": "De waterkringloop bestaat omdat het water honger heeft naar de aarde.", "feedback": "Wat een creatieve gedachte, maar water heeft gelukkig geen honger - de waterkringloop wordt juist aangejaagd door de warmte van de zon en de zwaarte kracht. Denk eens na welke natuurlijke krachten het water naar boven tillen en weer naar beneden trekken."}, {"id": "L14", "score": 0, "fout_tag": "[Begripsfout]", "antwoord": "Waternoom is een dier dat in de zee woont en dat spuilt dan het water de lucht in.", "feedback": "Goed dat je de waternoom herkint als een klein dier dat in het water leeft. Let op: de waternoom spuit geen water in de lucht, maar vangt zijn prooi met de kleine tentakels rond zijn mond — bekijk nog eens hoe hij zich voedt."}, {"id": "L15", "score": 0, "fout_tag": "[Begripsfout]", "antwoord": "Omdat de zon 's nachts het water drinkt en 's ochtends weer brukt op de aarde.", "feedback": "Je hebt alvast goed dat de zon een belangrijke rol speelt bij het verplaatsen van water, maar hij drinkt het niet en spit het ook niet terug — door de warmte van de zon verdampt het water en stijgt het als damp de lucht in. Pak de volgende keer eens aan wat er met het water gebeurt als de zon het warm maakt."}, {"id": "L18", "score": 1, "fout_tag": "[Vergeet condensatie]", "antwoord": "In de zee wordt water verdampt en dan regent het weer op de bergen.", "feedback": "Goed dat je ziet dat het water uit de zee verdampt en als regen op de landen neerkomt! Voor die regen moet het verdampt water eerst afkoelen en zich veranderen in wolken — noem dat proces maar bij de naam."}, {"id": "L19", "score": 1, "fout_tag": "[Vergeet condensatie]", "antwoord": "Het water loopt langzaam de berg op en dan valt het er weer van af als regen.", "feedback": "Je hebt de verdamping en de regen prima genoemd, maar je bent de condensatie vergeten: als het waterdamp in de hoogte stijgt, koelt het af en condenseert het tot wolken, en pas dan valt het als regen naar beneden."}, {"id": "L20", "score": 1, "fout_tag": "[Vergeet verdamping]", "antwoord": "Iets met wolken en regen, maar ik weet de fases niet echt te benoemen.", "feedback": "Je hebt al goed dat er wolken en regen bij komen kijken — dat is zeker een deel van de watersnelheid. De volgende stap is om ook de andere fasen te benoemen, met name de verdamping waar water door verandert in damp en de lucht in stijgt."}]}}};</script>
<style>
:root {
  --tafel: #DCE2E7;
  --tafel-diep: #CDD5DC;
  --papier: #FFFFFF;
  --inkt: #1C2833;
  --inkt-zacht: #56636F;
  --lijn: #C2CBD3;
  --stempel: #5B4FC4;   /* Tev1: sorteert met een stempel */
  --rood: #C2302A;      /* Nimble: nakijkpen */
  --groen: #1D7A45;     /* Clef: feedback in groen */
  --geel: #F4C430;      /* Qwen: markeerstift */
  --geel-zacht: #FBE7A1;
  --fout: #A3261F;
  --schaduw: 0 1px 0 rgba(28, 40, 51, .10), 0 3px 10px rgba(28, 40, 51, .07);
  --hand: "Kalam", "Segoe Print", "Comic Neue", cursive;
  --tekst: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tafel: #1D2824; --tafel-diep: #17201D; --papier: #26332E; --inkt: #E7EEEA;
    --inkt-zacht: #A3B3AB; --lijn: #3A4A43; --stempel: #A79BFF; --rood: #FF7E72;
    --groen: #74D69E; --geel: #F4C430; --geel-zacht: #5B4B16; --fout: #FF8F86;
    --schaduw: 0 1px 0 rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tafel: #1D2824; --tafel-diep: #17201D; --papier: #26332E; --inkt: #E7EEEA;
  --inkt-zacht: #A3B3AB; --lijn: #3A4A43; --stempel: #A79BFF; --rood: #FF7E72;
  --groen: #74D69E; --geel: #F4C430; --geel-zacht: #5B4B16; --fout: #FF8F86;
  --schaduw: 0 1px 0 rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--tafel);
  color: var(--inkt);
  font: 400 16px/1.45 var(--tekst);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--stempel); outline-offset: 2px; }

.pagina { max-width: 1680px; margin: 0 auto; padding: 20px 28px 40px; }

/* ── kop ─────────────────────────────────────────────────────────────── */
.kop {
  display: grid; grid-template-columns: 1fr auto; gap: 8px 32px; align-items: end;
  padding-bottom: 18px; border-bottom: 2px solid var(--inkt);
}
.kop h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--inkt-zacht); }
.vraag {
  margin: 4px 0 0; font-family: var(--hand); font-weight: 400;
  font-size: clamp(24px, 2.6vw, 38px); line-height: 1.15; max-width: 34ch;
}
.klok { text-align: right; }
.klok .tijd { font-size: clamp(34px, 3.6vw, 54px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.klok .status { margin-top: 6px; font-size: 15px; color: var(--inkt-zacht); }
.status .punt { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--groen); margin-right: 6px; vertical-align: 1px; }
.status.bezig .punt { animation: knipper 1.4s ease-in-out infinite; }
.status.klaar .punt { background: var(--inkt-zacht); }
.status.fout .punt { background: var(--fout); }
.sim-melding {
  grid-column: 1 / -1; justify-self: start; margin-top: 6px; padding: 4px 10px;
  border: 1.5px dashed var(--inkt-zacht); border-radius: 4px; font-size: 14px; color: var(--inkt-zacht);
}

/* ── estafette ───────────────────────────────────────────────────────── */
.estafette {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 22px 0 26px;
  position: relative;
}
.loper {
  --pen: var(--inkt);
  position: relative; padding: 14px 18px 16px 22px; background: var(--papier);
  border-top: 6px solid var(--pen); box-shadow: var(--schaduw);
  margin-right: 34px; min-height: 172px; display: flex; flex-direction: column;
  transition: transform .35s ease, box-shadow .35s ease, opacity .35s ease;
}
.loper:last-child { margin-right: 0; }
.loper::after {             /* het stokje dat doorgegeven wordt */
  content: ""; position: absolute; right: -30px; top: 50%; width: 26px; height: 4px;
  background: var(--lijn); border-radius: 2px;
}
.loper:last-child::after { display: none; }
.loper.klaar::after { background: var(--pen); }
.loper.wacht { opacity: .62; }
.loper.bezig { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--pen), var(--schaduw); }
.loper[data-stap="triage"]   { --pen: var(--stempel); }
.loper[data-stap="scoring"]  { --pen: var(--rood); }
.loper[data-stap="feedback"] { --pen: var(--groen); }
.loper[data-stap="briefing"] { --pen: #B98A00; }
:root[data-theme="dark"] .loper[data-stap="briefing"] { --pen: var(--geel); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .loper[data-stap="briefing"] { --pen: var(--geel); } }

.loper .naam { display: flex; align-items: baseline; gap: 10px; }
.loper .naam strong { font-size: 26px; line-height: 1.1; color: var(--pen); }
.loper .naam span { font-size: 16px; color: var(--inkt-zacht); }
.loper .model { margin-top: 8px; font-size: 15px; font-weight: 700; word-break: break-word; }
.loper .vervangt { font-size: 14px; color: var(--inkt-zacht); margin-top: 2px; }
.loper .vervangt s { text-decoration-thickness: 1.5px; }
.loper .voortgang { margin-top: auto; padding-top: 12px; }
.loper .balk { height: 6px; background: var(--tafel-diep); border-radius: 3px; overflow: hidden; }
.loper .balk i { display: block; height: 100%; background: var(--pen); width: 0; transition: width .5s ease; }
.loper .teller { display: flex; justify-content: space-between; margin-top: 6px; font-size: 14px; color: var(--inkt-zacht); font-variant-numeric: tabular-nums; }
.loper .teller b { color: var(--inkt); }

/* ── werkblad ────────────────────────────────────────────────────────── */
.werkblad { display: grid; grid-template-columns: 1fr 360px; gap: 28px; align-items: start; }
.sectiekop { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 12px; }
.sectiekop h2 { margin: 0; font-size: 20px; }
.sectiekop p { margin: 0; color: var(--inkt-zacht); font-size: 15px; }

.tickets { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.ticket {
  --kantel: 0deg;
  position: relative; text-align: left; border: 0; cursor: pointer;
  background: var(--papier); box-shadow: var(--schaduw); padding: 12px 14px 14px;
  border-left: 5px solid transparent; transform: rotate(var(--kantel));
  min-height: 178px; display: flex; flex-direction: column; gap: 8px;
  transition: opacity .4s ease, border-color .3s ease;
}
.ticket:hover { box-shadow: 0 0 0 2px var(--lijn), var(--schaduw); }
.ticket .boven { display: flex; justify-content: space-between; align-items: flex-start; min-height: 36px; }
.ticket .lid { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.ticket .antwoord { font-size: 15px; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ticket .antwoord.leeg { font-style: italic; color: var(--inkt-zacht); }
.ticket .tag { font-family: var(--hand); color: var(--rood); font-size: 17px; line-height: 1.1; }
.ticket .feedback {
  font-family: var(--hand); color: var(--groen); font-size: 16px; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  border-top: 1px dashed var(--lijn); padding-top: 6px; margin-top: auto;
}
.ticket .bezig-label { margin-top: auto; font-size: 14px; color: var(--pen, var(--inkt-zacht)); font-weight: 700; }
.ticket .bezig-label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; animation: knipper 1.2s ease-in-out infinite; }
.ticket.actief-triage   { --pen: var(--stempel); border-left-color: var(--stempel); }
.ticket.actief-scoring  { --pen: var(--rood); border-left-color: var(--rood); }
.ticket.actief-feedback { --pen: var(--groen); border-left-color: var(--groen); }
.ticket.ongeldig { opacity: .5; }
.ticket.ongeldig .antwoord { text-decoration: line-through; text-decoration-color: var(--inkt-zacht); }

.score {
  font-family: var(--hand); font-weight: 700; color: var(--rood); font-size: 22px; line-height: 1;
  border: 2.5px solid var(--rood); border-radius: 50%; width: 52px; height: 40px;
  display: grid; place-items: center; transform: rotate(-8deg); flex: none;
}
.stempel {
  display: inline-block; align-self: flex-start; font-weight: 700; font-size: 12.5px; letter-spacing: .12em;
  color: var(--stempel); border: 2px solid var(--stempel); border-radius: 3px; padding: 1px 6px;
  transform: rotate(-4deg); opacity: .9;
}
.stempel.regel { border-style: dashed; }
.regel-uitleg { font-size: 13px; color: var(--inkt-zacht); margin-top: 4px; }
.net { animation: neerkomen .45s cubic-bezier(.2, .9, .3, 1.2); }

/* ── zijkolom ────────────────────────────────────────────────────────── */
.zij { display: flex; flex-direction: column; gap: 28px; position: sticky; top: 16px; }
.paneel { background: var(--papier); box-shadow: var(--schaduw); padding: 16px 18px 18px; }
.paneel h2 { margin: 0 0 12px; font-size: 18px; }
.paneel .uitleg { margin: -6px 0 12px; font-size: 14px; color: var(--inkt-zacht); }
.staaf { display: grid; grid-template-columns: 1fr 34px; gap: 4px 10px; align-items: center; margin-bottom: 9px; }
.staaf .label { grid-column: 1 / -1; font-size: 14px; }
.staaf .spoor { height: 12px; background: var(--tafel-diep); border-radius: 2px; overflow: hidden; }
.staaf .spoor i { display: block; height: 100%; background: var(--rood); transition: width .5s ease; }
.staaf .getal { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.kengetal { display: flex; gap: 22px; margin-bottom: 14px; }
.kengetal div { font-size: 14px; color: var(--inkt-zacht); }
.kengetal b { display: block; font-size: 26px; color: var(--inkt); font-variant-numeric: tabular-nums; }
.leeg-melding { color: var(--inkt-zacht); font-size: 14px; margin: 0; }

.logboek { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; font-size: 14px; }
.logboek li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--tafel-diep); }
.logboek li:last-child { border-bottom: 0; }
.logboek time { color: var(--inkt-zacht); font-variant-numeric: tabular-nums; }
.logboek .tekst { border-left: 3px solid var(--lijn); padding-left: 8px; word-break: break-word; }
.logboek [data-stap="triage"] .tekst { border-color: var(--stempel); }
.logboek [data-stap="scoring"] .tekst { border-color: var(--rood); }
.logboek [data-stap="feedback"] .tekst { border-color: var(--groen); }
.logboek [data-stap="briefing"] .tekst { border-color: var(--geel); }
.logboek .wissel .tekst, .logboek .stokje .tekst { font-weight: 700; }
.logboek .fout .tekst { color: var(--fout); font-weight: 700; }

/* ── briefing ────────────────────────────────────────────────────────── */
.briefing { margin-top: 34px; }
.briefing .blad { background: var(--papier); box-shadow: var(--schaduw); padding: 26px 34px 30px; }
.briefing .wacht { color: var(--inkt-zacht); margin: 0; }
.md { max-width: 78ch; }
.md h2, .md h3 {
  display: inline; font-size: 21px; line-height: 1.5;
  background: linear-gradient(transparent 58%, var(--geel-zacht) 58%);
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.md h3 { font-size: 18px; }
.md .kopblok { margin: 26px 0 10px; }
.md .kopblok:first-child { margin-top: 0; }
.md p, .md li { font-size: 16px; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin-bottom: 4px; }
.md blockquote { margin: 0 0 12px; padding: 6px 14px; border-left: 4px solid var(--geel); background: var(--tafel); }
.md hr { border: 0; border-top: 1px solid var(--lijn); margin: 18px 0; }
.md table { border-collapse: collapse; margin: 4px 0 14px; font-size: 15px; width: 100%; max-width: 78ch; }
.md th, .md td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--lijn); vertical-align: top; }
.md th { border-bottom: 2px solid var(--inkt); }
.md code { font-size: .92em; background: var(--tafel); padding: 0 4px; border-radius: 3px; }
.briefing .bron { margin: 18px 0 0; font-size: 14px; color: var(--inkt-zacht); }

/* ── detail ──────────────────────────────────────────────────────────── */
dialog {
  border: 0; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--papier); color: var(--inkt); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(28, 40, 51, .45); }
.detail { padding: 22px 26px 24px; }
.detail header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.detail h2 { margin: 0; font-size: 22px; }
.detail .sluit { border: 1.5px solid var(--lijn); background: transparent; padding: 4px 12px; cursor: pointer; border-radius: 4px; }
.detail .antwoord-groot { font-size: 18px; margin: 0 0 18px; padding: 12px 14px; background: var(--tafel); }
.detail .regel { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--lijn); }
.detail .regel > b { font-size: 15px; }
.detail .regel[data-stap="triage"] > b { color: var(--stempel); }
.detail .regel[data-stap="scoring"] > b { color: var(--rood); }
.detail .regel[data-stap="feedback"] > b { color: var(--groen); }
.detail .wie { font-size: 14px; color: var(--inkt-zacht); margin-top: 2px; }
.detail .hand { font-family: var(--hand); font-size: 19px; line-height: 1.3; }

/* ── lege toestand ───────────────────────────────────────────────────── */
.nog-niets { max-width: 620px; margin: 12vh auto; background: var(--papier); box-shadow: var(--schaduw); padding: 30px 34px; }
.nog-niets h1 { margin: 0 0 10px; font-size: 24px; }
.nog-niets p { margin: 0 0 10px; }
.nog-niets code { background: var(--tafel); padding: 2px 6px; border-radius: 3px; }

@keyframes knipper { 50% { opacity: .25; } }
@keyframes neerkomen { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } }

@media (max-width: 1180px) {
  .werkblad { grid-template-columns: 1fr; }
  .zij { position: static; display: grid; grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .estafette { grid-template-columns: 1fr 1fr; gap: 16px; }
  .loper { margin-right: 0; }
  .loper::after { display: none; }
}
@media (max-width: 600px) {
  .pagina { padding: 16px 16px 32px; }
  .kop { grid-template-columns: 1fr; }
  .klok { text-align: left; }
  .estafette { grid-template-columns: 1fr; }
  .zij { grid-template-columns: 1fr; }
  .briefing .blad { padding: 20px 18px; }
  .detail .regel { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="detail" aria-labelledby="detail-titel"><div class="detail" id="detail-inhoud"></div></dialog>

<script>
(function () {
  "use strict";
  const STAPPEN = ["triage", "scoring", "feedback", "briefing"];
  const WERKWOORD = { triage: "sorteert", scoring: "scoort", feedback: "schrijft feedback", briefing: "vat samen voor de docent" };
  const BEZIG_TEKST = { triage: "wordt gesorteerd", scoring: "wordt gescoord", feedback: "feedback wordt geschreven" };
  const app = document.getElementById("app");
  const dialoog = document.getElementById("detail");
  const dialoogInhoud = document.getElementById("detail-inhoud");

  let S = null;            // huidige toestand
  let vorige = {};         // per leerling: welke markeringen er al stonden (voor de neerkom-animatie)
  let laatsteJSON = "";
  let openId = null;
  let geladen = false;

  // ── hulpjes ──────────────────────────────────────────────────────────
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const kortModel = (m) => (m || "").replace(/^(CLUSTER|ERASMUS)\./, "");
  const nu = () => Date.now();
  const kantel = (id) => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 997; return ((h % 13) - 6) / 10; };
  const tagTekst = (t) => (t || "").replace(/^\[|\]$/g, "");

  // ── minimale markdown (koppen, lijsten, tabellen, citaat, vet/cursief) ─
  function inline(t) {
    return esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/(^|\W)_([^_\s][^_]*)_(?=\W|$)/g, "$1<em>$2</em>");
  }
  function markdown(src) {
    const regels = String(src || "").replace(/\r/g, "").split("\n");
    let html = "", i = 0;
    const isTabel = (r) => /^\s*\|.*\|\s*$/.test(r);
    while (i < regels.length) {
      const r = regels[i];
      if (!r.trim()) { i++; continue; }
      let m;
      if ((m = r.match(/^(#{1,4})\s+(.*)$/))) {
        const niveau = m[1].length <= 2 ? "h2" : "h3";
        html += `<div class="kopblok"><${niveau}>${inline(m[2])}</${niveau}></div>`; i++; continue;
      }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(r)) { html += "<hr>"; i++; continue; }
      if (isTabel(r)) {
        const rijen = [];
        while (i < regels.length && isTabel(regels[i])) { rijen.push(regels[i]); i++; }
        const cellen = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const kop = cellen(rijen[0]);
        const lijf = rijen.slice(1).filter((x) => !/^\s*\|?\s*:?-{2,}/.test(x));
        html += "<table><thead><tr>" + kop.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
          lijf.map((x) => "<tr>" + cellen(x).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
        continue;
      }
      if (/^\s*>/.test(r)) {
        const blok = [];
        while (i < regels.length && /^\s*>/.test(regels[i])) { blok.push(regels[i].replace(/^\s*>\s?/, "")); i++; }
        html += `<blockquote>${inline(blok.join(" "))}</blockquote>`; continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(r)) {
        const geordend = /^\s*\d+[.)]/.test(r);
        const items = [];
        while (i < regels.length && (/^\s*([-*+]|\d+[.)])\s+/.test(regels[i]) || (/^\s{2,}\S/.test(regels[i]) && items.length))) {
          const x = regels[i];
          if (/^\s*([-*+]|\d+[.)])\s+/.test(x)) items.push({ diep: /^\s{2,}/.test(x), t: x.replace(/^\s*([-*+]|\d+[.)])\s+/, "") });
          else items[items.length - 1].t += " " + x.trim();
          i++;
        }
        const tag = geordend ? "ol" : "ul";
        const begin = geordend ? parseInt(r.trim(), 10) || 1 : 1;
        html += `<${tag}${begin > 1 ? ` start="${begin}"` : ""}>` + items.map((it) => `<li${it.diep ? ' style="margin-left:18px;list-style:circle"' : ""}>${inline(it.t)}</li>`).join("") + `</${tag}>`;
        continue;
      }
      const alinea = [];
      while (i < regels.length && regels[i].trim() && !/^(#{1,4}\s|\s*>|\s*([-*+]|\d+[.)])\s+|\s*\|)/.test(regels[i])) { alinea.push(regels[i]); i++; }
      if (!alinea.length) { alinea.push(regels[i]); i++; }
      html += `<p>${inline(alinea.join(" "))}</p>`;
    }
    return html;
  }

  // ── tellingen ────────────────────────────────────────────────────────
  function tel(s) {
    const L = s.leerlingen;
    const getriageerd = L.filter((l) => l.triage);
    const geldig = L.filter((l) => l.triage === "GELDIG");
    const gescoord = L.filter((l) => l.score_s != null);
    const metFeedback = L.filter((l) => l.feedback_s != null);
    return {
      triage: { klaar: getriageerd.length, totaal: L.length },
      scoring: { klaar: gescoord.length, totaal: s.stappen.triage.status === "klaar" ? geldig.length : null },
      feedback: { klaar: metFeedback.length, totaal: s.stappen.scoring.status === "klaar" ? gescoord.length : null },
      briefing: { klaar: s.briefing ? 1 : 0, totaal: 1 },
      geldig: geldig.length, ongeldig: getriageerd.length - geldig.length, gescoord
    };
  }

  // ── weergave ─────────────────────────────────────────────────────────
  function render() {
    if (!S) {
      app.innerHTML = `<div class="nog-niets"><h1>Nog geen run gestart</h1>
        <p>Start de estafette in een terminal in deze map:</p>
        <p><code>python pipeline_live.py</code></p>
        <p>Of oefen zonder gateway: <code>python pipeline_live.py --simulatie</code></p>
        <p>Deze pagina werkt zichzelf bij zodra de run begint. Je hoeft niet te verversen.</p></div>`;
      return;
    }
    const t = tel(S);
    const verstreken = (S.klaar_op || nu()) - S.gestart;
    const statusTekst = S.status === "klaar" ? "klaar" : S.status === "fout" ? "gestopt door een fout" : (S.modus === "simulatie" ? "simulatie loopt" : "live");

    let html = `<div class="pagina">
      <header class="kop">
        <div><h1>Nakijk-estafette: exit-ticket waterkringloop</h1>
          <p class="vraag">${esc(S.vraag)}</p></div>
        <div class="klok"><div class="tijd" id="klok">${mmss(verstreken)}</div>
          <div class="status ${esc(S.status)}"><span class="punt"></span>${esc(statusTekst)}</div></div>
        ${S.modus === "simulatie" ? `<div class="sim-melding">Simulatie: dit speelt opgenomen modelantwoorden na, er draait nu geen model.</div>` : ""}
        ${S.status === "fout" ? `<div class="sim-melding" style="color:var(--fout);border-color:var(--fout)">${esc(S.fout)}</div>` : ""}
      </header>
      <section class="estafette" aria-label="De vier modellen in de estafette">${STAPPEN.map((k) => loper(k, t)).join("")}</section>
      <div class="werkblad">
        <section aria-labelledby="kop-tickets">
          <div class="sectiekop"><h2 id="kop-tickets">De klas: ${S.leerlingen.length} exit-tickets</h2>
            <p>${t.ongeldig ? `${t.ongeldig} apart gelegd` : "Klik op een ticket voor alle details"}</p></div>
          <div class="tickets">${S.leerlingen.map(ticket).join("")}</div>
        </section>
        <aside class="zij">${klasbeeld(t)}${logboek()}</aside>
      </div>
      ${briefingBlok()}
    </div>`;
    app.innerHTML = html;
    if (openId) vulDetail(openId);
  }

  function loper(k, t) {
    const st = S.stappen[k];
    const v = t[k];
    const model = st.gebruikt || st.probeert || st.bedoeld;
    const vervangen = st.gebruikt && st.gebruikt !== st.bedoeld;
    const pct = v.totaal ? Math.round((100 * v.klaar) / v.totaal) : 0;
    const duur = st.status === "klaar" ? mmss(st.duur * 1000) : st.status === "bezig" && st.gestart ? mmss(nu() - st.gestart) : "";
    const statusLabel = st.status === "klaar" ? `klaar in ${duur}` : st.status === "bezig" ? `aan het werk, <span data-sinds="${st.gestart}">${duur}</span>` : "wacht op het stokje";
    let extra = "";
    const veld = { triage: "triage_model", scoring: "score_model", feedback: "feedback_model" }[k];
    const anderen = {};
    if (veld) S.leerlingen.forEach((l) => { const m = l[veld]; if (m && m !== model && !m.startsWith("voorfilter")) anderen[m] = (anderen[m] || 0) + 1; });
    const ookTekst = Object.entries(anderen).map(([m, n]) => `${esc(kortModel(m))} ${n}×`).join(", ");
    if (vervangen) extra = `<div class="vervangt">valt in voor <s>${esc(kortModel(st.bedoeld))}</s></div>`;
    else if (st.status === "bezig" && !st.gebruikt && st.uitgevallen.length) extra =`<div class="vervangt">${esc(kortModel(st.uitgevallen[st.uitgevallen.length - 1].model))} viel uit</div>`;
    if (ookTekst) extra += `<div class="vervangt">ook ingevallen: ${ookTekst}</div>`;
    return `<article class="loper ${esc(st.status)}" data-stap="${k}">
      <div class="naam"><strong>${esc(st.naam)}</strong><span>${WERKWOORD[k]}</span></div>
      <div class="model">${esc(kortModel(model))}</div>${extra}
      <div class="voortgang"><div class="balk"><i style="width:${pct}%"></i></div>
        <div class="teller"><span><b>${v.klaar}</b>${v.totaal != null ? " / " + v.totaal : ""}</span><span>${statusLabel}</span></div></div>
    </article>`;
  }

  function ticket(l) {
    const was = vorige[l.id] || {};
    const net = (sleutel, nuAanwezig) => (nuAanwezig && !was[sleutel] && geladen ? " net" : "");
    const leeg = !(l.antwoord || "").trim();
    const klassen = ["ticket"];
    if (l.actief) klassen.push("actief-" + l.actief);
    if (l.triage === "ONGELDIG") klassen.push("ongeldig");
    const score = l.score_s != null ? `<div class="score${net("score", true)}" aria-label="score ${l.score == null ? "onleesbaar" : l.score + " van 2"}">${l.score == null ? "?" : l.score + "/2"}</div>` : "";
    const doorRegel = (l.triage_model || "").startsWith("voorfilter");
    const stempel = l.triage ? `<span class="stempel${doorRegel ? " regel" : ""}${net("triage", true)}">${esc(l.triage)}</span>${doorRegel ? `<div class="regel-uitleg">vaste regel, geen model</div>` : ""}` : "";
    const tag = l.score_s != null && l.fout_tag ? `<div class="tag${net("tag", true)}">${esc(tagTekst(l.fout_tag))}</div>` : "";
    const fb = l.feedback_s != null ? `<div class="feedback${net("feedback", true)}">${esc(l.feedback)}</div>` : "";
    const bezig = l.actief ? `<div class="bezig-label"><span>${BEZIG_TEKST[l.actief]}</span> <span data-sinds="${l.actief_sinds}">${mmss(nu() - l.actief_sinds)}</span></div>` : "";
    return `<button class="${klassen.join(" ")}" style="--kantel:${kantel(l.id)}deg" data-id="${esc(l.id)}" aria-label="Exit-ticket ${esc(l.id)}">
      <div class="boven"><div><div class="lid">${esc(l.id)}</div>${stempel}</div>${score}</div>
      <div class="antwoord${leeg ? " leeg" : ""}">${leeg ? "(leeg ingeleverd)" : esc(l.antwoord)}</div>
      ${tag}${fb}${bezig}
    </button>`;
  }

  function klasbeeld(t) {
    const g = t.gescoord.filter((l) => l.score != null);
    if (!g.length) return `<section class="paneel"><h2>Klasbeeld</h2><p class="leeg-melding">Verschijnt zodra Nimble de eerste scores geeft.</p></section>`;
    const gem = (g.reduce((a, l) => a + l.score, 0) / g.length).toFixed(2).replace(".", ",");
    const verdeling = [2, 1, 0].map((s) => ({ label: s === 2 ? "2 punten, volledig" : s === 1 ? "1 punt, deels" : "0 punten, nog niet", n: g.filter((l) => l.score === s).length }));
    const tags = {};
    t.gescoord.forEach((l) => { const k = tagTekst(l.fout_tag); if (k) tags[k] = (tags[k] || 0) + 1; });
    const tagRijen = Object.entries(tags).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...verdeling.map((v) => v.n), ...tagRijen.map((x) => x[1]));
    const staaf = (label, n) => `<div class="staaf"><span class="label">${esc(label)}</span><span class="spoor"><i style="width:${(100 * n) / max}%"></i></span><span class="getal">${n}</span></div>`;
    return `<section class="paneel"><h2>Klasbeeld</h2>
      <div class="kengetal"><div><b>${gem}</b>gemiddeld van 2</div><div><b>${g.length}</b>gescoord</div><div><b>${t.ongeldig}</b>apart gelegd</div></div>
      ${verdeling.map((v) => staaf(v.label, v.n)).join("")}
      <h2 style="margin-top:18px">Fouten</h2>
      ${tagRijen.map(([k, n]) => staaf(k, n)).join("")}
    </section>`;
  }

  function logboek() {
    const items = S.log.slice(-80).reverse();
    return `<section class="paneel"><h2>Logboek</h2>
      <ol class="logboek">${items.map((e) => `<li class="${esc(e.soort)}" data-stap="${esc(e.stap || "")}"><time>${mmss(e.t - S.gestart)}</time><span class="tekst">${esc(e.tekst)}</span></li>`).join("")}</ol></section>`;
  }

  function briefingBlok() {
    const st = S.stappen.briefing;
    let inhoud;
    if (S.briefing) {
      inhoud = `<div class="md">${markdown(S.briefing.markdown)}</div>
        <p class="bron">${S.briefing.lokaal ? "Qwen was niet bereikbaar; dit is de vaste reserve-briefing." : `Geschreven door ${esc(kortModel(S.briefing.model))} op basis van de scores en fout-tags hierboven.`}</p>`;
    } else if (st.status === "bezig") {
      inhoud = `<p class="wacht">Qwen leest alle scores en feedback en schrijft de briefing…</p>`;
    } else {
      inhoud = `<p class="wacht">Qwen schrijft de briefing zodra alle feedback binnen is.</p>`;
    }
    return `<section class="briefing" aria-labelledby="kop-briefing"><div class="sectiekop"><h2 id="kop-briefing">Docent-briefing</h2></div><div class="blad">${inhoud}</div></section>`;
  }

  // ── detailvenster ────────────────────────────────────────────────────
  function vulDetail(id) {
    const l = S.leerlingen.find((x) => x.id === id);
    if (!l) return;
    const leeg = !(l.antwoord || "").trim();
    const wie = (model, sec) => model ? `<div class="wie">${esc(kortModel(model))}${sec ? `, ${String(sec).replace(".", ",")} s` : ""}</div>` : "";
    const regel = (stap, titel, inhoud) => `<div class="regel" data-stap="${stap}"><b>${titel}</b><div>${inhoud}</div></div>`;
    let h = `<header><h2 id="detail-titel">Exit-ticket ${esc(l.id)}</h2><button class="sluit" type="button" data-sluit>Sluiten</button></header>
      <p class="antwoord-groot">${leeg ? "<em>(leeg ingeleverd)</em>" : esc(l.antwoord)}</p>`;
    h += regel("triage", "Tev1", l.triage ? `<span class="stempel${(l.triage_model || "").startsWith("voorfilter") ? " regel" : ""}">${esc(l.triage)}</span>${l.triage_reden ? ` <span class="wie">(${esc(l.triage_reden)})</span>` : ""}${wie(l.triage_model, l.triage_s)}` : "<span class=wie>nog niet gesorteerd</span>");
    if (l.triage !== "ONGELDIG") {
      h += regel("scoring", "Nimble", l.score_s != null ? `<span class="hand" style="color:var(--rood)">${l.score == null ? "onleesbaar" : l.score + "/2"}, ${esc(tagTekst(l.fout_tag))}</span>${wie(l.score_model, l.score_s)}` : "<span class=wie>nog niet gescoord</span>");
      h += regel("feedback", "Clef", l.feedback_s != null ? `<div class="hand" style="color:var(--groen)">${esc(l.feedback)}</div>${wie(l.feedback_model, l.feedback_s)}` : "<span class=wie>nog geen feedback</span>");
    } else {
      h += regel("scoring", "", `<span class="wie">Apart gelegd: dit ticket gaat niet door naar scoring en feedback.</span>`);
    }
    dialoogInhoud.innerHTML = h;
  }
  app.addEventListener("click", (e) => {
    const knop = e.target.closest(".ticket");
    if (!knop) return;
    openId = knop.dataset.id; vulDetail(openId);
    if (!dialoog.open) dialoog.showModal();
  });
  dialoog.addEventListener("click", (e) => { if (e.target === dialoog || e.target.closest("[data-sluit]")) dialoog.close(); });
  dialoog.addEventListener("close", () => { openId = null; });

  // ── klok: tikt tussen updates door ───────────────────────────────────
  setInterval(() => {
    if (!S) return;
    const k = document.getElementById("klok");
    if (k && S.status === "bezig") k.textContent = mmss(nu() - S.gestart);
    document.querySelectorAll("[data-sinds]").forEach((el) => { const s = +el.dataset.sinds; if (s) el.textContent = mmss(nu() - s); });
  }, 500);

  // ── gegevens binnenhalen ─────────────────────────────────────────────
  function ontvang(s) {
    const j = JSON.stringify(s);
    if (j === laatsteJSON) return;
    if (S && s.run_id !== S.run_id) { vorige = {}; geladen = false; }   // nieuwe run gestart
    laatsteJSON = j; S = s;
    const scrollY = window.scrollY;
    const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null;
    const logScroll = (document.querySelector(".logboek") || {}).scrollTop || 0;
    render();
    window.scrollTo(0, scrollY);
    const lb = document.querySelector(".logboek"); if (lb) lb.scrollTop = logScroll;
    if (focusId) { const el = app.querySelector(`.ticket[data-id="${focusId}"]`); if (el) el.focus({ preventScroll: true }); }
    vorige = {};
    S.leerlingen.forEach((l) => { vorige[l.id] = { triage: !!l.triage, score: l.score_s != null, tag: l.score_s != null, feedback: l.feedback_s != null }; });
    geladen = true;
  }
  window.__clefState = ontvang;

  if (window.__clefInline) {            // momentopname na afloop: geen polling
    ontvang(window.__clefInline);
    return;
  }
  render();
  function haal() {
    const sc = document.createElement("script");
    sc.src = "live_state.js?t=" + nu();
    sc.onload = sc.onerror = () => sc.remove();
    document.head.appendChild(sc);
  }
  haal();
  setInterval(haal, 1000);
})();
</script>
</body>
</html>
